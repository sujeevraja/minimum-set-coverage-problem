[project]
name = "mscp"
version = "0.1.0"
description = "Minimum Set Coverage Problem"
requires-python = ">=3.9"
dependencies = [
    "mip>=1.15",
    "numpy>=1.21",
]

[dependency-groups]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["utility", "problem_instance", "solver", "controller"]
